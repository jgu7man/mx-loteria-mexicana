<div
  class="home-container min-h-screen bg-gradient-to-br from-green-600 to-teal-700 flex flex-col items-center justify-center p-8 relative overflow-hidden"
>
  <!-- Background Cards Layer -->
  <div class="background-cards-layer absolute inset-0 pointer-events-none">
    <div
      *ngFor="let bgCard of backgroundCards"
      class="background-card absolute"
      [style.left.%]="bgCard.left"
      [style.top.%]="bgCard.top"
      [style.transform]="
        'rotate(' + bgCard.rotation + 'deg) scale(' + bgCard.scale + ')'
      "
      [style.opacity]="bgCard.opacity"
    >
      <app-card
        [card]="bgCard.card"
        [size]="'medium'"
        [showVerso]="false"
      ></app-card>
    </div>
  </div>

  <!-- Content Layer (elevated) -->
  <div class="content-layer relative z-10 w-full flex flex-col items-center">
    <!-- Header -->
    <header class="text-center mb-12">
      <div class="flex items-center justify-center gap-4 mb-4">
        <img
          src="assets/images/icons/Logotipo_Banco_Falabella.svg"
          alt="Logo"
          class="h-16 w-auto drop-shadow-2xl"
        />
        <h1 class="text-6xl font-bold text-white drop-shadow-2xl">
          Lotería Mexicana
        </h1>
        <img
          src="assets/images/icons/Logotipo_Banco_Falabella.svg"
          alt="Logo"
          class="h-16 w-auto drop-shadow-2xl"
        />
      </div>
      <p class="text-xl text-white opacity-90 drop-shadow-lg">
        Juega en tiempo real con tus amigos
      </p>
    </header>

    <!-- Role Selection -->
    <div
      class="roles-grid grid grid-cols-1 md:grid-cols-3 gap-8 max-w-6xl w-full"
    >
      <div
        *ngFor="let role of roles"
        (click)="selectRole(role)"
        class="role-card bg-white rounded-2xl shadow-2xl p-8 cursor-pointer transition-all duration-300 hover:scale-105 hover:shadow-3xl"
        [style.border-top]="'6px solid ' + role.color"
      >
        <!-- Icon -->
        <div class="role-icon text-8xl text-center mb-4">
          {{ role.emoji }}
        </div>

        <!-- Title -->
        <h2 class="text-2xl font-bold text-gray-800 text-center mb-4">
          {{ role.name }}
        </h2>

        <!-- Description -->
        <p class="text-gray-600 text-center mb-6">
          {{ role.description }}
        </p>

        <!-- Button -->
        <button
          class="w-full py-3 px-6 rounded-lg font-semibold text-white transition-all duration-300 hover:opacity-90"
          [style.background-color]="role.color"
        >
          Continuar
        </button>
      </div>
    </div>

    <!-- Footer -->
    <footer class="mt-12 text-white text-center">
      <p class="text-sm opacity-75">Hecho con amor por Jorge Guzmán ❤️</p>
    </footer>
  </div>
</div>
