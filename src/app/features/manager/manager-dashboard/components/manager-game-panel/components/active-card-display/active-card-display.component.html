<div
  class="bg-white rounded-3xl shadow-md p-6 h-full flex flex-col justify-between"
>
  <!-- Próxima Carta (Grande, con verso) -->
  <div class="mb-6">
    <!-- Encabezado -->
    <p class="text-gray-400 text-xs uppercase font-bold mb-3 tracking-wider text-center">
      SIGUIENTE CARTA
      <span class="text-red-400">(SÓLO TÚ LA VES)</span>
    </p>
    
    <!-- Carta Grande -->
    <div
      id="next-card"
      class="flex flex-col justify-center flex-1 items-center min-h-[250px]"
    >
    <app-card
      [card]="nextCardPreview()!"
      [size]="'large'"
      [showVerso]="false"
    ></app-card>
      <div class="text-center" *ngIf="nextCardPreview()">
        <!-- Verso debajo de la carta -->
        <div class="mt-4 bg-indigo-50 rounded-2xl p-4 max-w-sm mx-auto">
          <p class="text-[10px] uppercase font-bold text-indigo-400 mb-1 text-center tracking-widest">
            Sugerencia de verso
          </p>
          <p class="text-indigo-700 italic font-semibold text-center text-lg">
            {{ nextCardPreview()?.verso || "..." }}
          </p>
        </div>
      </div>

      <div
        *ngIf="!nextCardPreview()"
        class="w-56 h-72 bg-gradient-to-br from-gray-50 to-gray-100 rounded-3xl border-4 border-gray-200 flex flex-col items-center justify-center shadow-inner"
      >
        <div class="text-6xl text-gray-800 font-bold mb-2">?</div>
        <div class="text-gray-400 font-semibold tracking-widest text-sm">
          PRÓXIMA CARTA…
        </div>
      </div>
    </div>
  </div>

  <!-- Botones Principales -->
  <div class="flex justify-center mb-6">
    <button
      *ngIf="isRoomWaiting(room()?.state || 'waiting')"
      (click)="startRound.emit()"
      class="bg-indigo-600 text-white px-8 py-4 rounded-xl font-bold hover:bg-indigo-700 transition text-lg shadow-lg w-full max-w-sm"
    >
      {{ getButtonText() }}
    </button>
    <button
      *ngIf="isRoomActive(room()?.state || 'waiting')"
      (click)="nextCard.emit()"
      class="bg-indigo-600 text-white px-8 py-4 rounded-xl font-bold hover:bg-indigo-700 transition text-lg shadow-lg w-full max-w-sm"
    >
      {{ getButtonText() }}
    </button>
  </div>

  <!-- Carta Actual (Pequeña) -->
  <div
    id="current-card"
    class="flex justify-center items-center pb-2"
  >
    <div class="text-center">
      <p class="text-xs uppercase font-bold text-gray-400 mb-2 tracking-widest">
        Carta Actual
      </p>
      <app-card
        *ngIf="currentCard()"
        [card]="currentCard()!"
        [size]="'small'"
        [showVerso]="false"
      ></app-card>
      
      <div
        *ngIf="!currentCard()"
        class="w-32 h-40 bg-gradient-to-br from-gray-50 to-gray-100 rounded-2xl border-2 border-gray-200 flex flex-col items-center justify-center shadow-inner"
      >
        <div class="text-3xl text-gray-400 font-bold">-</div>
      </div>
    </div>
  </div>
</div>
