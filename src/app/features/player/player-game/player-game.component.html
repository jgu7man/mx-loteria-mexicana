<div
  class="player-container min-h-screen bg-gradient-to-br from-green-600 to-teal-700 p-4 md:p-6 xl:p-8 max-w-full overflow-x-hidden"
>
  <!-- Loading -->
  <div *ngIf="isLoading() && !showJoinForm()" class="text-center py-20">
    <div
      class="bg-white/90 backdrop-blur-sm rounded-3xl p-12 max-w-md mx-auto shadow-2xl"
    >
      <div class="flex flex-col items-center gap-6">
        <div class="relative">
          <div class="w-20 h-20 border-8 border-gray-200 rounded-full"></div>
          <div
            class="w-20 h-20 border-8 border-green-600 border-t-transparent rounded-full animate-spin absolute top-0"
          ></div>
        </div>
        <p class="text-xl font-semibold text-gray-700">Cargando...</p>
      </div>
    </div>
  </div>

  <!-- Podium overlay -->
  <app-podium
    *ngIf="
      !isLoading() &&
      showPodium() &&
      !showMarkerSelector() &&
      !showTablaSelector()
    "
    [winners]="currentRoundWinners()"
    [allParticipants]="participants()"
    [roundNumber]="room()?.currentRound || 0"
    [maxRounds]="room()?.config?.maxRounds || 0"
    [isLastRound]="room()?.state === 'finished'"
  >
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <button
        *ngIf="room()?.state === 'finished'"
        (click)="goHome()"
        class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-indigo-700 transition shadow-lg flex items-center justify-center gap-2"
      >
        <span>🏠</span> Volver al Inicio
      </button>
      <button
        *ngIf="room()?.state !== 'finished'"
        (click)="showMarkerSelector.set(true)"
        class="bg-white text-blue-800 px-6 py-3 rounded-xl font-bold hover:bg-blue-50 transition shadow-lg border-2 border-blue-600 flex items-center justify-center gap-2"
      >
        <span>✏️</span> Cambiar Marcador
      </button>
      <button
        *ngIf="room()?.state !== 'finished'"
        (click)="showTablaSelector.set(true)"
        class="bg-white text-indigo-800 px-6 py-3 rounded-xl font-bold hover:bg-indigo-50 transition shadow-lg border-2 border-indigo-600 flex items-center justify-center gap-2"
      >
        <span>📋</span> Cambiar Tabla
      </button>
    </div>
  </app-podium>

  <!-- Join form -->
  <app-player-join-form
    *ngIf="showJoinForm()"
    [(displayName)]="displayName"
    [(roomId)]="roomId"
    (signInAnonymously)="signInAnonymously()"
    (signInWithGoogle)="signInWithGoogle()"
    (goHome)="goHome()"
  >
  </app-player-join-form>

  <!-- Room Deleted Message -->
  <div
    *ngIf="!isLoading() && isRoomDeleted() && !showJoinForm()"
    class="fixed inset-0 bg-gray-900/90 z-50 flex items-center justify-center p-4"
  >
    <div
      class="bg-white rounded-2xl p-8 max-w-md w-full text-center shadow-2xl"
    >
      <div class="text-6xl mb-4">🚫</div>
      <h2 class="text-2xl font-bold text-gray-800 mb-2">Sala Eliminada</h2>
      <p class="text-gray-600 mb-6">
        El administrador ha cerrado o eliminado esta sala de juego.
      </p>
      <button
        (click)="goHome()"
        class="w-full bg-indigo-600 text-white py-3 px-6 rounded-xl font-bold hover:bg-indigo-700 transition transform hover:scale-105 shadow-lg"
      >
        🏠 Volver al Inicio
      </button>
    </div>
  </div>

  <!-- Marker selector -->
  <div *ngIf="!isLoading() && showMarkerSelector()" class="max-w-2xl mx-auto">
    <div class="bg-white rounded-2xl shadow-2xl p-8">
      <div *ngIf="selectedMarker() || myTabla().length > 0" class="mb-4">
        <button
          (click)="cancelMarkerSelection()"
          class="bg-gray-200 text-gray-700 px-6 py-3 rounded-lg font-semibold hover:bg-gray-300 transition"
        >
          ← Cancelar
        </button>
      </div>
      <h2 class="text-2xl font-bold text-gray-800 mb-2">
        Selecciona tu Marcador
      </h2>
      <p class="text-gray-600 mb-6">
        ✨ Elige el marcador que usarás para marcar las cartas en tu tabla
        durante el juego.
      </p>
      <app-marker (markerSelected)="onMarkerSelected($event)"></app-marker>
    </div>
  </div>

  <!-- Tabla selector -->
  <app-player-tabla-selector
    *ngIf="!isLoading() && showTablaSelector()"
    [availableTablas]="availableTablas()"
    [showCancelButton]="myTabla().length > 0"
    (tablaSelected)="selectTabla($event)"
    (cancel)="cancelTablaSelection()"
    (requestMore)="refreshAvailableTablas()"
  >
  </app-player-tabla-selector>

  <!-- Game view -->
  <app-player-game-board
    *ngIf="
      !isLoading() &&
      !isRoomDeleted() &&
      !showJoinForm() &&
      !showMarkerSelector() &&
      !showTablaSelector()
    "
    (changeMarker)="startChangingMarker()"
    (changeTabla)="startChangingTabla()"
    (goHome)="goHome()"
  >
  </app-player-game-board>
</div>
