<div class="relative">
  <!-- DESKTOP LAYOUT (xl) -->
  <div class="hidden xl:grid xl:grid-cols-12 gap-6 pt-0">
    <!-- Left column: Header + Carta Actual + historial -->
    <div class="xl:col-span-3 space-y-4">
      <app-player-room-header
        [room]="room()"
        [roomId]="roomId()"
        (goHome)="goHome.emit()"
      ></app-player-room-header>

      <app-player-current-card
        [currentCard]="currentCard()"
        [size]="'large'"
      ></app-player-current-card>

      <!-- Historial de cartas -->
      <div class="flex gap-3">
        <app-player-card-history
          [historyCards]="historyCards()"
          [maxCards]="2"
          [roomState]="room()?.state || 'waiting'"
          [showWaitingMessage]="showWaitingMessage()"
        ></app-player-card-history>
      </div>
    </div>

    <!-- Center: Tabla -->
    <div class="xl:col-span-6 relative">
      <!-- Verification Overlay -->
      <div
        *ngIf="isWaitingForVerification()"
        class="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 rounded-2xl flex items-center justify-center"
      >
        <div
          class="bg-white rounded-2xl p-8 max-w-sm mx-4 text-center shadow-2xl"
        >
          <div class="text-6xl mb-4 animate-pulse">⏳</div>
          <h3 class="text-2xl font-bold text-gray-800 mb-2">Verificando...</h3>
          <p class="text-gray-600">
            El administrador está revisando tu tabla. Por favor aguarda un
            momento.
          </p>
        </div>
      </div>

      <div id="tabla-desktop" class="rounded-2xl py-0 px-[3.5rem]">
        <app-tabla
          [tablaCards]="myTabla()"
          [marks]="myMarks()"
          [markerEmoji]="selectedMarkerEmoji()"
          [markerImage]="selectedMarkerImage()"
          [isInteractive]="!isWaitingForVerification()"
          [size]="'large'"
          (cardClicked)="onCardClicked($event)"
        >
        </app-tabla>
      </div>
    </div>

    <!-- Right column: Botones de acción -->
    <div class="xl:col-span-3 space-y-4">
      <app-player-action-buttons
        [layout]="'vertical'"
        [size]="'large'"
        (changeMarker)="changeMarker.emit()"
        (changeTabla)="changeTabla.emit()"
      >
      </app-player-action-buttons>

      <!-- Lista de Jugadores -->
      <app-player-list
        [players]="players()"
        [variant]="'compact'"
        [maxHeight]="'max-h-[300px]'"
        [showPhotos]="false"
      >
      </app-player-list>
    </div>
  </div>

  <!-- TABLET LAYOUT (md) -->
  <div class="hidden md:block xl:hidden">
    <app-player-room-header
      class="mb-3"
      [room]="room()"
      [roomId]="roomId()"
      (goHome)="goHome.emit()"
    ></app-player-room-header>

    <div class="space-y-4">
      <div class="grid grid-cols-4 gap-4">
        <!-- Tabla (izquierda, 3 columnas) -->
        <div class="col-span-3 bg rounded-2xl relative">
          <!-- Verification Overlay -->
          <div
            *ngIf="isWaitingForVerification()"
            class="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 rounded-2xl flex items-center justify-center"
          >
            <div
              class="bg-white rounded-2xl p-6 max-w-xs mx-4 text-center shadow-2xl"
            >
              <div class="text-5xl mb-3 animate-pulse">⏳</div>
              <h3 class="text-xl font-bold text-gray-800 mb-2">
                Verificando...
              </h3>
              <p class="text-gray-600 text-sm">
                El administrador está revisando tu tabla. Por favor aguarda un
                momento.
              </p>
            </div>
          </div>

          <app-tabla
            [tablaCards]="myTabla()"
            [marks]="myMarks()"
            [markerEmoji]="selectedMarkerEmoji()"
            [markerImage]="selectedMarkerImage()"
            [isInteractive]="!isWaitingForVerification()"
            [size]="'large'"
            (cardClicked)="onCardClicked($event)"
          >
          </app-tabla>
        </div>

        <!-- Right side: Carta Actual + historial -->
        <div class="col-span-1 space-y-3 overflow-y-hidden h-[84vw]">
          <div class="bg-blue-100 rounded-2xl p-3 border-4 border-blue-300">
            <app-player-current-card
              [currentCard]="currentCard()"
              [size]="'medium'"
            ></app-player-current-card>
          </div>

          <!-- Historial de cartas -->
          <div class="space-y-2">
            <app-player-card-history
              [historyCards]="historyCards()"
              [maxCards]="3"
              [roomState]="room()?.state || 'waiting'"
              [showWaitingMessage]="showWaitingMessage()"
            ></app-player-card-history>
          </div>
        </div>
      </div>

      <!-- Botones -->
      <app-player-action-buttons
        [layout]="'horizontal'"
        [compact]="true"
        (changeMarker)="changeMarker.emit()"
        (changeTabla)="changeTabla.emit()"
      >
      </app-player-action-buttons>

      <!-- Lista de Jugadores -->
      <app-player-list
        [players]="players()"
        [variant]="'compact'"
        [maxHeight]="'max-h-[200px]'"
        [showPhotos]="false"
      >
      </app-player-list>
    </div>
  </div>

  <!-- MOBILE LAYOUT (< md) -->
  <div class="md:hidden space-y-4 max-w-full overflow-x-hidden">
    <app-player-room-header
      [room]="room()"
      [roomId]="roomId()"
      (goHome)="goHome.emit()"
    ></app-player-room-header>

    <!-- Top: Carta Actual + historial placeholders (horizontal) -->
    <div
      class="grid gap-2 w-full items-end"
      [ngClass]="currentCard() ? 'grid-cols-4' : 'grid-cols-1'"
    >
      <div class="col-span-1" *ngIf="currentCard()">
        <app-player-current-card
          [currentCard]="currentCard()"
          [size]="'small'"
        ></app-player-current-card>
      </div>

      <!-- Historial de cartas -->
      <div
        [ngClass]="currentCard() ? 'col-span-3' : 'col-span-1'"
        class="flex gap-3 overflow-x-auto pb-2"
      >
        <app-player-card-history
          [historyCards]="historyCards()"
          [maxCards]="3"
          [roomState]="room()?.state || 'waiting'"
          [showWaitingMessage]="showWaitingMessage()"
        ></app-player-card-history>
      </div>
    </div>

    <!-- Tabla -->
    <div class="rounded-2xl relative w-full">
      <!-- Verification Overlay -->
      <div
        *ngIf="isWaitingForVerification()"
        class="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 rounded-2xl flex items-center justify-center"
      >
        <div
          class="bg-white rounded-2xl p-6 max-w-xs mx-4 text-center shadow-2xl"
        >
          <div class="text-5xl mb-3 animate-pulse">⏳</div>
          <h3 class="text-xl font-bold text-gray-800 mb-2">Verificando...</h3>
          <p class="text-gray-600 text-sm">
            El administrador está revisando tu tabla. Por favor aguarda un
            momento.
          </p>
        </div>
      </div>

      <app-tabla
        [tablaCards]="myTabla()"
        [marks]="myMarks()"
        [markerEmoji]="selectedMarkerEmoji()"
        [markerImage]="selectedMarkerImage()"
        [isInteractive]="!isWaitingForVerification()"
        [size]="'large'"
        (cardClicked)="onCardClicked($event)"
      >
      </app-tabla>
    </div>

    <!-- Botones -->
    <app-player-action-buttons
      [layout]="'horizontal'"
      [compact]="true"
      (changeMarker)="changeMarker.emit()"
      (changeTabla)="changeTabla.emit()"
    >
    </app-player-action-buttons>

    <!-- Lista de Jugadores -->
    <app-player-list
      [players]="players()"
      [variant]="'compact'"
      [maxHeight]="'max-h-[200px]'"
      [showPhotos]="false"
    >
    </app-player-list>
  </div>
</div>
