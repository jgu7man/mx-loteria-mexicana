<div class="tabla-container bg-white rounded-xl shadow-2xl mb-3 p-2 sm:p-4">
  <div class="tabla-grid grid grid-cols-4">
    <div
      *ngFor="let cardId of tablaCards"
      (click)="onCardClick(cardId)"
      class="tabla-cell"
    >
      <app-card
        *ngIf="getCard(cardId)"
        [card]="getCard(cardId)!"
        [size]="size"
        [isMarked]="isMarked(cardId)"
        [markerEmoji]="markerEmoji"
        [markerImage]="markerImage"
      >
      </app-card>
    </div>
  </div>
</div>
