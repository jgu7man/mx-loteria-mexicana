<div class="marker-selector">
  <div class="flex flex-col md:flex-row gap-4 justify-center">
    <button
      *ngFor="let marker of markers"
      (click)="selectMarker(marker)"
      class="marker-option relative p-6 rounded-xl shadow-lg transition-all duration-300 hover:scale-110 cursor-pointer"
      [class.selected]="isSelected(marker)"
      [style.background-color]="marker.color"
    >
      <!-- Imagen SVG si está disponible, sino emoji -->
      <div class="marker-emoji text-6xl" *ngIf="!marker.image">{{ marker.emoji }}</div>
      <img 
        *ngIf="marker.image" 
        [src]="marker.image" 
        [alt]="marker.name"
        class="h-16 w-auto mx-auto"
      />
      <div
        class="marker-name text-white font-bold mt-2 text-center drop-shadow-lg"
      >
        {{ marker.name }}
      </div>

      <!-- Selected indicator -->
      <div
        *ngIf="isSelected(marker)"
        class="selected-indicator absolute -top-2 -right-2 bg-green-500 rounded-full p-2"
      >
        <span class="text-white text-xl">✓</span>
      </div>
    </button>
  </div>
</div>
